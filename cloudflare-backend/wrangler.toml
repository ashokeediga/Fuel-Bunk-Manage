name = "fuel-bunk-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "fuel-bunk-db"
database_id = "YOUR_D1_DATABASE_ID" # Cloudflare dashboard లో క్రియేట్ చేసినప్పుడు వచ్చే ID

